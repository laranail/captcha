name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full suite with every optional integration installed. altcha-org/altcha is a dev
  # dependency precisely so the ALTCHA adapter is integration-tested against the real
  # library rather than a hand-written approximation of its challenge format.
  test:
    name: PHP ${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13']
        stability: [prefer-stable]
        include:
          # One lowest-dependency run, on the floor. This is what catches a constraint that
          # claims a floor the code does not actually hold to.
          #
          # The floor is 8.4.1 rather than 8.4.0, inherited from laranail/console's dependency
          # on symfony/tui. setup-php resolves '8.4' to the latest 8.4.x, so this run does not
          # prove 8.4.1 specifically — the constraint in composer.json is what does.
          - php: '8.4'
            laravel: '13'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

  # The same suite with the optional integration *removed*.
  #
  # This is the job that matters for the dependency contract: the package must work with
  # illuminate/* and the laranail family alone. Installing altcha in every job would hide a
  # hard dependency that had crept out of the ALTCHA adapter into shared code, and the first
  # person to find it would be a user who picked Turnstile.
  test-without-optional:
    name: No optional integrations · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Remove the optional integration
        run: composer remove --dev --no-update --no-interaction altcha-org/altcha

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the suite without the altcha group
        run: vendor/bin/pest --ci --exclude-group=altcha

      # Proves absence rather than assuming it. `composer show` exiting zero is the failure:
      # if altcha resolved back in transitively, this job would otherwise pass while testing
      # the wrong thing.
      - name: Assert the optional package really is absent
        run: |
          if composer show altcha-org/altcha >/dev/null 2>&1; then
            echo "::error::altcha-org/altcha is still installed; this job is not testing what it claims to."
            exit 1
          fi

  # A boot-health gate: every degradable registration must have completed after a normal
  # boot. A captcha package that silently fails to register its validation rule leaves an
  # application that starts cleanly and accepts every form submission, which no functional
  # test catches — so it is asserted directly.
  boot-health:
    name: Boot health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Assert nothing degraded at boot
        run: vendor/bin/pest --ci tests/Feature/BootHealthTest.php
