name: Browser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the widget in Chromium.
  #
  # Its own workflow because it needs a browser download, which no other job does, and because it
  # covers something the PHP suite structurally cannot. `tests/js/harness.mjs` executes the same
  # runtime against a hand-rolled DOM and catches the syntax-and-typo class outright — but it stubs
  # `MutationObserver.observe()` as an empty method and has no Livewire, so the re-initialisation
  # path and the morph skip are executed by nothing there.
  #
  # That is not a theoretical gap. Removing the observer entirely, unregistering the Livewire hook,
  # applying the morph skip to self-hosted providers, and pointing `aria-describedby` at a
  # non-existent id were each tried: the Node harness reported every one of them green, and this
  # job failed on all four.
  browser:
    name: Widget runtime in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: this family does not commit lock files, and ci requires one.
      - name: Install Playwright
        working-directory: tests/Browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The Pest test renders the fixtures from Blade and then drives them, so it is the entry
      # point rather than `npx playwright test` — which would run against whatever HTML happened
      # to be on disk.
      - name: Run the browser suite
        run: vendor/bin/pest --ci --group=browser | tee browser.log

      # The suite skips itself when Playwright is absent, and a skipped test exits zero. Without
      # this, a broken install step would leave a job that is green and has opened no browser —
      # the exact false confidence the suite exists to remove.
      - name: Assert the browser suite actually ran
        run: |
          if grep -qiE 'skipped|no tests' browser.log; then
            echo "::error::The browser suite did not run. Playwright is probably not installed."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/Browser/playwright-report
            tests/Browser/test-results
          retention-days: 7
          if-no-files-found: ignore
